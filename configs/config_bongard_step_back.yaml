agent_class: multi_turn

llm:
  provider: claude
  model: claude-opus-4-6
  temperature: 0.7
  max_tokens: 65536
  system_prompt: "You are a precise and thorough problem-solver who is an excellent scientific thinker."

graph:
  entry: step_back

  nodes:
    step_back:
      prompt: |
        {problem}

        INSTRUCTION: This is a Bongard problem. Do not solve it yet! Instead, step back and paraphrase this into a more generic, higher-level question that is easier to answer. What are the principles, concepts, or general knowledge needed to solve this kind of problem? Answer that step-back question first.
    solve_with_principles:
      prompt: |
        INSTRUCTION: Now, using the principles and concepts you described above, solve the original Bongard problem. Ground your reasoning in those foundational ideas.
    keep_thinking:
      prompt: |
        INSTRUCTION: You haven't found the answer yet. Keep generating new ideas.

  edges:
    - { from: step_back, to: solve_with_principles }
    - { from: solve_with_principles, to: keep_thinking }
    - { from: keep_thinking, to: keep_thinking, max_repeats: 5 }

  side_channels:
    - id: answer_check
      run_after: [solve_with_principles, keep_thinking]
      check_answer: true
      graph:
        entry: give_solution
        nodes:
          give_solution:
            prompt: |
              Give your full solution: state the rule in a single sentence.
          extract_rule:
            prompt: |
              Reply with ONLY the rule as a single short sentence.
              No labels, no markdown, no explanation — just the rule itself on a single line.
          write_python_function:
            prompt: |
              Now encode that rule as a Python function.
              The function must be named `rule`, take a single string argument, and return True if the string satisfies the rule (Group A) or False otherwise (Group B):

              ```python
              def rule(s: str) -> bool:
                  ...
              ```

              Reply with ONLY a single ```python code block containing the function. No explanation, no tests. Use only the Python standard library.
        edges:
          - { from: give_solution, to: extract_rule }
          - { from: extract_rule, to: write_python_function }
