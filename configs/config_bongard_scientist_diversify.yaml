agent_class: multi_turn

# MAIN TREATMENT: full 3-step scientist strategy.
# Step 1: minimal-difference pair contrast → feature categories (exhaustive)
# Step 2: enumerate members within each category (exhaustive)
# Step 3: generate hypotheses from the populated feature space

llm:
  provider: claude
  model: claude-opus-4-6
  temperature: 0.7
  max_tokens: 65536
  system_prompt: "You are a precise and thorough problem-solver who is an excellent scientific thinker."

graph:
  entry: identify_pairs_and_categories

  nodes:
    identify_pairs_and_categories:
      prompt: |
        {problem}
        INSTRUCTION: Do not solve it yet! Think like a scientist. First, identify a set of positive-negative example pairs with minimal differences. Next, consider the space of all possible ways you could describe those differences and exhaustively generate a set of high-level feature categories that systematically capture this space. You should be able to generate a family of specific features within each of these categories (but do not do this yet!)

    enumerate_members:
      prompt: |
        INSTRUCTION: For each category, exhaustively generate the possible members. Then stop.

    generate_hypotheses:
      prompt: |
        INSTRUCTION: Exhaustively generate reasonable hypotheses based on these features given the problem instance. Be thorough and exhaustive. Follow the principle of Occam's Razor and prioritize the simpler hypotheses, all else equal. Do not select an answer yet.

    keep_generating:
      prompt: |
        INSTRUCTION: You haven't found the answer yet. Survey your ideas up to this point in terms of the higher-level categories they belong to. Keep generating new ideas, making sure to maintain good coverage at the category level (but don't waste time with categories you believe to be eliminated as possibilities).

  edges:
    - { from: identify_pairs_and_categories, to: enumerate_members }
    - { from: enumerate_members, to: generate_hypotheses }
    - { from: generate_hypotheses, to: keep_generating }
    - { from: keep_generating, to: keep_generating, max_repeats: 5 }

  side_channels:
    - id: answer_check
      run_after: [generate_hypotheses, keep_generating]
      check_answer: true
      graph:
        entry: give_solution
        nodes:
          give_solution:
            prompt: |
              Give your full solution: state the rule in a single sentence.
          extract_rule:
            prompt: |
              Reply with ONLY the rule as a single short sentence.
              No labels, no markdown, no explanation — just the rule itself on a single line.
          write_python_function:
            prompt: |
              Now encode that rule as a Python function.
              The function must be named `rule`, take a single string argument, and return True if the string satisfies the rule (Group A) or False otherwise (Group B):

              ```python
              def rule(s: str) -> bool:
                  ...
              ```

              Reply with ONLY a single ```python code block containing the function. No explanation, no tests. Use only the Python standard library.
        edges:
          - { from: give_solution, to: extract_rule }
          - { from: extract_rule, to: write_python_function }
