agent_class: cartesian_product
max_iterations: 10
hypotheses_per_batch: 2

# Per-phase refinement toggles
enable_refine_parent_class: true
refine_parent_class_iterations: 2
enable_refine_search_strategy: false
enable_refine_begin_solve: true
refine_begin_solve_iterations: 3

max_revisions: 1
max_depth: 20

# LLM provider config. Used by example.py / create_client_from_config().
llm:
  provider: claude              # "claude" or "openai"
  # model: claude-sonnet-4-20250514
  # model: claude-sonnet-4-5-20250929
  model: claude-opus-4-5-20251101 
  temperature: 0.7
  max_tokens: 6000
  system_prompt: "You are a precise and thorough problem-solver who is an excellent scientific thinker. You never say things not supported by evidence. You are cold and calculating and never make qualitative statements like \"Seems promising!\". You never say anything to favor one possibility over another, like \"Key insight:...\" or \"This seems crucial...\". You always enumerate all logical possibilities, never just a set of examples. You only generate one \"thought\" per turn and carefully follow instructions regarding when to stop."

# Prompt templates by phase.
# These contain ONLY the new instruction for each step.
# Context (interleaved prompts + responses) is prepended by the code at call time.
parent_class_prompt: |
  Problem: {problem}

  Don't yet solve the problem above! Take these steps in sequence:
  1. Identify the class of problem this belongs to. Choose a class that is as specific as you can get.
  2. Given your choice, list out the key problem dimensions (excluding the answer/solution itself). Do this in the abstract (i.e. don't mention any specifics from the current problem yet).
  3. Convert those dimensions into a comprehensive set of functions/mappings and variables that need to be determined in order to generate a candidate solution. DO NOT fill in any guesses yet.
  4. Formally state the domain of each function and variable, e.g. x \in {{x1, x2, ...}}. DO NOT filter out any possibilities yet. Keep it comprehensive.
  5. Use pseudo-code to describe the algorithm that generates a solution given the variables you identified.
  Once again: DO NOT INSTANTIATE A VARIABLE FOR THE FINAL ANSWER. You will be generating this as a "prediction" given the other variable values.
refine_parent_class_prompt: |
  Another agent generated the above text. Your job is to do cleanup and refinement to improve the output quality. Guidelines:
  -- Whenever possibilities are being listed, fill in any missing items you can think of to make sure they are thorough
  -- Pay careful attention to step 5 (the algorithm). Step through your algorithm considering specific examples. Are the variables combined in a complete way? Are there cases that would not be covered properly under your code?
  -- After you finish thinking, write "COPY FROM HERE:", followed by your revised output for me to extract and do a drop-in replacement with the old text
  -- Make sure that all the points you make are get reflected in your revised algorithm
begin_solve_prompt: |
  Next, you will generate a comprehensive set of **single-variable** hypotheses for the variables/mappings you listed above.
  These will be fed into a generator that takes the cartesian product of your lists of values.
  Thus, make **absolutely certain** that the way you list out the variables and their values will provide full coverage of the space of possibilities you can envisage.
  For example:
  -- there may not be an exact 1-to-1 correspondence between the list of variables as written above and the what needs to go in your dictionary, and necessitating tweaks
  -- be sure to account for multi-dimensional variables (e.g. if one variable should really itself be a cartesian product or list)
  Think through some specific (hypothetical) examples and decide: If you chose one value from each variable and put them into a list, would this make logical sense and fully specify a unique possibility? If not, is there some way the variables should be restructured so that it does make sense?
  The answer may be unrecoverable if you err in this part.

  Guidelines:
  -- Go line by line on your previous output and make sure you hit all considerations.
  -- Order your lists so the more likely possibilities are considered earlier. (Use your initial instincts given the specific problem instance.)
  -- Each combination of variables should fully specify a hypothesis. All the choices should make sense together.
  -- List your variables as a python dict like:
  -- DO NOT add comments to any lines of your dict
  {{
    'var1_name': <list of vals>,
    'var2_name': <list of vals>,
    ...
  }}
  Finally, sample ~20 examples from the cartesian product you've just established. Make the variety high to maximize coverage of the space. Just the list. No commentary or additional thoughts!
refine_begin_solve_prompt: |
  EXAMPLE HYPOTHESES:
  {example_hypotheses}

  A previous agent output the above list of single variable hypotheses. A few example hypotheses generated with this list are provided for illustration.
  Your job is to improve the single variable hypotheses by any combination of:
  -- Thinking of possibilities they missed within a variable assignment
  -- Generating new variables they omitted
  -- Modifying variables to more fully capture space of possibilities
  -- Reordering the possibilities by priority
  -- Fixing bad instruction following (e.g. shouldn't candidate answers in the iterator!)
  
  Guidelines:
  -- Think through the generated examples and decide: Does this make logical sense and fully specify a unique possibility? If not, is there some way the variables should be restructured so that it does make sense?
  -- Go line by line on your previous output and make sure you hit all considerations that have previously been raised
  -- Think carefully and step by step about the variable lists and whether the example hypotheses reveal issues with the previous agent's work. Are any possibilities being missed? Do the hypotheses provide all necessary information. Are they logically consistent?
  -- When you've finished thinking, generate your revised dict using the same output format, i.e.:
  {{
    'var1_name': <list of vals>,
    'var2_name': <list of vals>,
    ...
  }}
  Make sure to cover the full space of possibilities within the domain. Do not use terms like "highly promising", "likely" or "strong candidate". You are simply listing possibilities here.
test_hypothesis_prompt: |
  VARIABLES: {variables}
  HYPOTHESIS: {hypothesis}

  Test the above hypothesis. Be thorough and accurate. While testing you may:
  1. Find evidence that supports it
  2. Find evidence against it
  3. Find the hypothesis is not fully or adequately specified as is and requires a modification to the list of domain variables. 
  4. Find there was some error with the generator (e.g. unexpected or nonsense outputs)
  5. Find there is no valid solution
  Important: Don't ever say something is "confirmed" or "promising" or "likely", as this causes you to get stuck and keep circling one favored possibility.

  When finished thinking, generate a python dict like:
  ```python
  {{
    'prediction': prediction,  # Result of testing hypothesis. `None` if (3) or (4) encountered above 
    'evidence_for': positive_evidence,
    'evidence_against': negative_evidence,
    'trace': trace  # Trace of implementation, e.g. step-by-step reasoning. Very condensed summary.
    'recommendations': recommendations,  # Recommend new domain variables or code fixes
    'observations': observations  # Briefly summarize any interesting observations
  }}
  ```
revise_generator_prompt: |
  VARIABLES: {variables}
  HYPOTHESIS: {tested_hypotheses}

  Consider the above hypothesis tests. Check for:
  -- General observations: Briefly note any observations that might suggest a revision to your single-variable hypotheses. 
  -- Reprioritizing: Note any reorderings of hypotheses that are warranted
  Generate an update to the single-variable hypotheses or state "No update".
  Important: Don't ever say something is "confirmed" or "promising" or "likely", etc., as this causes you to get stuck and keep circling one favored possibility.
solution_extract_prompt: |
  Extract and state the final solution. No extra characters; just the solution.

