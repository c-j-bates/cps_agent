agent_class: multi_turn

# Ablation #2: pair-contrast + hypotheses in one step.
# No exhaustive category enumeration.
# Has the keep_generating loop so it matches the treatment in budget.

llm:
  provider: claude
  model: claude-opus-4-6
  temperature: 0.7
  max_tokens: 65536
  system_prompt: "You are a precise and thorough problem-solver who is an excellent scientific thinker."

graph:
  entry: identify_pairs_and_categories

  nodes:
    identify_pairs_and_categories:
      prompt: |
        {problem}

        INSTRUCTION: Do not solve it yet! Think like a scientist. First, identify a set of positive-negative example pairs with minimal differences. Next, consider the space of all possible ways you could describe those differences and exhaustively generate a set of high-level feature categories that systematically capture this space. You should be able to generate a family of specific features within each of these categories (but do not do this yet!)
    
    taxonomize:
      prompt: |
        For each high-level category already identified, go one level down and list all the sub-categories such that all possibilities are well-covered. Then stop. Make sure all bullets get a number using 1.x style. Each subcategory should be entirely independent of all others such that the target concept could be located entirely within it.
    
    abstract:
      prompt: |
        Revise your sub-subcategories to make them as abstract as possible. They should cover all logical possibilities.
    
    generate_hypotheses:
      prompt: |
        INSTRUCTION: Exhaustively generate reasonable hypotheses, prioritizing the a priori most likely ones. Follow the principle of Occam's Razor and prioritize the simpler hypotheses, all else equal. The correct answer will not be baroque, since the puzzle designer wanted it to be solvable.

        For each hypothesis, follow this format:

        Hypothesis YY: <some hypothesis that fits in X.X>
        Test: <test hypothesis against data>
        Outcome: <reject | accept>
        Notes: <None | misc. thoughts>

        Remember that your taxonomy above is not fully comprehensive and thus may or may not contain the solution. Stop when you think you've found the answer.

    keep_generating:
      prompt: |
        INSTRUCTION: You haven't found the answer yet. Keep generating new hypotheses. Remember: For each hypothesis, follow this format:

        Hypothesis YY: <some hypothesis that fits in X.X>
        Test: <test hypothesis against data>
        Outcome: <reject | accept>
        Notes: <None | misc. thoughts>

        Remember that your taxonomy above is not fully comprehensive and thus may or may not contain the solution. Stop when you think you've found the answer.

  edges:
    - { from: identify_pairs_and_categories, to: taxonomize }
    - { from: taxonomize, to: abstract }
    - { from: abstract, to: generate_hypotheses }
    - { from: generate_hypotheses, to: keep_generating }
    - { from: keep_generating, to: keep_generating, max_repeats: 5 }

  side_channels:
    - id: answer_check
      run_after: [generate_hypotheses, keep_generating]
      check_answer: true
      graph:
        entry: give_solution
        nodes:
          give_solution:
            prompt: |
              Give your full solution: state the rule in a single sentence.
          extract_rule:
            prompt: |
              Reply with ONLY the rule as a single short sentence.
              No labels, no markdown, no explanation — just the rule itself on a single line.
          write_python_function:
            prompt: |
              Now encode that rule as a Python function.
              The function must be named `rule`, take a single string argument, and return True if the string satisfies the rule (Group A) or False otherwise (Group B):

              ```python
              def rule(s: str) -> bool:
                  ...
              ```

              Reply with ONLY a single ```python code block containing the function. No explanation, no tests. Use only the Python standard library.
        edges:
          - { from: give_solution, to: extract_rule }
          - { from: extract_rule, to: write_python_function }
