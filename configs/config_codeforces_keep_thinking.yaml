agent_class: multi_turn

llm:
  provider: deepseek-cloud
  model: deepseek-reasoner
  temperature: 0.7
  max_tokens: 65536
  system_prompt: "You are a precise and thorough problem-solver who is an excellent competitive programmer and scientific thinker."

graph:
  entry: solve

  nodes:
    solve:
      prompt: |
        {problem}

        Solve the above competitive-programming problem. Think step-by-step: work out the approach,
        check it fits the time and memory limits, and verify it on the sample input(s). Then output a
        complete, efficient C++17 solution that reads from stdin and writes to stdout, as a single
        ```cpp code block. If your solution turns out to be wrong you will get further turns to fix it.

    keep_thinking:
      prompt: |
        Your last submission was judged and rejected:

            {feedback}

        Keep thinking. Use the judge feedback above (which test failed and how — wrong answer, time
        limit exceeded, runtime or compilation error) to guide the fix: revise the code, or rethink
        the approach if it is fundamentally too slow or incorrect. Re-check the time/memory limits and
        the sample outputs. End your message with the complete final ```cpp solution.

  edges:
    - { from: solve, to: keep_thinking }
    - { from: keep_thinking, to: keep_thinking, max_repeats: 5 }

  side_channels:
    - id: answer_check
      run_after: [solve, keep_thinking]
      check_answer: true
      graph:
        entry: give_solution
        nodes:
          give_solution:
            prompt: |
              Output your current best complete C++17 solution for this problem and NOTHING else:
              a single ```cpp code block that reads from stdin and writes to stdout. No commentary.
        edges: []
