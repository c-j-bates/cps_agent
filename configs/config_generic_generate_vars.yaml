agent_class: multi_turn

llm:
  provider: claude
  model: claude-opus-4-6
  temperature: 0.7
  max_tokens: 65536
  system_prompt: "You are a precise and thorough problem-solver who is an excellent scientific thinker."

graph:
  entry: generate_vars

  nodes:
    generate_vars:
      prompt: |
        {problem}
        Do not solve this problem yet! Instead, first, exhaustively generate the set of variables that define this class of problem. These should be independent of this particular problem instance. DO NOT start pursuing an answer yet.
    enumerate_values:
      prompt: |
        For each variable, exhaustively generate the possible values they could take on. Then stop.
    generate_combos:
      prompt: |
        Exhaustively generate reasonable combinations of values, working through each combination. Do not select an answer yet.
    keep_generating:
      prompt: |
        You haven't found the answer yet. Keep generating new ideas.

  edges:
    - { from: generate_vars, to: enumerate_values }
    - { from: enumerate_values, to: generate_combos }
    - { from: generate_combos, to: keep_generating }
    - { from: keep_generating, to: keep_generating, max_repeats: 5 }

  side_channels:
    - id: answer_check
      run_after: [generate_combos, keep_generating]
      check_answer: true
      graph:
        entry: give_solution
        nodes:
          give_solution:
            prompt: |
              Give your full solution.
          extract_answer:
            prompt: |
              Reply with ONLY the final answer. No labels, no markdown, no explanation, no punctuation — just the answer itself on a single line.
        edges:
          - { from: give_solution, to: extract_answer }
